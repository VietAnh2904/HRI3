[develop]
script_dir=$base/lib/ur3_llm_control
[install]
install_scripts=$base/lib/ur3_llm_control
[flake8]
max-line-length = 110
# _deps / _msgs hold third-party sources downloaded by the offline check tools
exclude = .git,__pycache__,build,install,log,*/_deps/*,*/_msgs/*,.pytest_cache
[tool:pytest]
# the ROS 2 launch_testing pytest plugins (active when ROS is sourced) are not
# needed here and break with recent pytest versions
addopts = -p no:launch_testing -p no:launch_ros -p no:launch_pytest
testpaths = test
