# ros2_control controllers loaded by the gazebo_ros2_control plugin
# (passed to ur_description/urdf/ur.urdf.xacro as simulation_controllers).
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # fingers: position targets tracked by a PD that outputs FORCE (effort)
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    # VELOCITY commands (with position feedback) instead of the usual position
    # interface: gazebo_ros2_control applies a position command by teleporting
    # the joint (SetPosition + zero velocity), so the moving fingers would have
    # no velocity and could not drag a block by friction.  With velocity
    # commands the links really move and the grasp is physical.
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    gains:
      shoulder_pan_joint:  {p: 30.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      shoulder_lift_joint: {p: 30.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      elbow_joint:         {p: 30.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      wrist_1_joint:       {p: 30.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      wrist_2_joint:       {p: 30.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      wrist_3_joint:       {p: 30.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      elbow_joint: { trajectory: 0.2, goal: 0.1 }
      wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      wrist_3_joint: { trajectory: 0.2, goal: 0.1 }


gripper_controller:
  ros__parameters:
    # Each finger is pulled towards its target by a spring-like PD force
    # (effort = p * error, limited to the URDF effort limit).  Closing target
    # = 0 (fingers together): on a 4 cm block each finger squeezes with about
    # p * 0.02 m = 8 N, and the two "springs" keep the block centred between
    # the fingers while the arm moves.  The block is held only by friction.
    joints:
      - left_finger_joint
      - right_finger_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      left_finger_joint:  {p: 400.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      right_finger_joint: {p: 400.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 1.0
      goal_time: 0.0
